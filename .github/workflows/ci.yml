name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs-check:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos fundacionales
        run: |
          test -f README.md
          test -f ROADMAP.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          test -f CHANGELOG.md
          echo "Archivos fundacionales OK"
      - name: Verificar estructura de documentación
        run: |
          test -d docs
          test -d docs/vision
          test -d docs/architecture
          test -d docs/decisions
          test -d docs/requirements
          test -d docs/experiments
          test -d docs/development
          test -d docs/hardware
          echo "Estructura docs OK"
      - name: Verificar ADRs
        run: |
          test -f docs/decisions/ADR-0001-kernel-foundation.md
          test -f docs/decisions/ADR-0002-kernel-prototype.md
          test -f docs/decisions/ADR-0003-scheduler.md
          test -f docs/decisions/ADR-0004-preemption-timer.md
          test -f docs/decisions/ADR-0005-ipc-blocking.md
          echo "ADRs OK"

  host-build:
    name: Host prototype (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar clang y make
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make
      - name: Compilar host prototype
        working-directory: platforms/host
        run: make CC=clang
      - name: Ejecutar tests
        working-directory: platforms/host
        run: make CC=clang test
      - name: Verificar binario
        working-directory: platforms/host
        run: |
          test -f build/omega-host
          file build/omega-host

  kernel-build:
    name: Kernel prototype (build ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar clang, lld, llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make
      - name: Compilar kernel bare-metal aarch64
        working-directory: kernel
        run: make CC=clang
      - name: Verificar binarios
        working-directory: kernel
        run: |
          test -f build/omega.elf
          test -f build/omega.bin
          file build/omega.elf
          file build/omega.bin
